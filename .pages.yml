# Pages CMS configuration (https://pagescms.org). Text and pictures are edited here; layout lives in templates/.
media:
  input: static/assets/img
  output: /assets/img
  extensions: [webp, jpg, jpeg, png, gif, svg]

components:
  sentence:
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{vi}"
    fields:
      - name: id
        label: ID（請勿修改）
        type: string
        readonly: true
      - name: vi
        label: Tiếng Việt
        type: text
      - name: zh
        label: 繁體中文
        type: text
      - name: en
        label: English
        type: text
      - name: ko
        label: 한국어
        type: text

content:
  - name: home
    label: "首頁"
    type: file
    path: content/home.json
    format: json
    fields:
      - name: strings
        label: 文字（每一筆是一句，四種語言並排）
        component: sentence
  - name: common
    label: "共用文字（選單、頁尾、表單、按鈕）"
    type: file
    path: content/common.json
