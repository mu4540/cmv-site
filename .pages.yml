    format: json
    fields:
      - name: images
        label: 圖片（在「image」欄上傳新圖即可替換）
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{where}"
        fields:
          - name: where
            label: 出現位置
            type: string
            readonly: true
          - name: original
            label: 原始檔案（請勿修改）
            type: string
            readonly: true
          - name: image
            label: 目前使用的圖片
            type: image
  - name: company
